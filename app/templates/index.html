<!DOCTYPE html>
<html>
<head>
    <title>Page de données</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <h1>Identification</h1>
    <form action="/" method="POST">
        <label for="nom">Nom: </label>
        <input type="text" name="nom" required>
        <br>
        <label for="numero_tel">Numéro de téléphone:</label>
        <input type="tel" name="numero_tel" required>
        <br>
        <label for="adresse">Adresse de livraison:</label>
        <input type="text" name="adresse" required>
        <br>
        <div>
    <h1>Pizza:</h1>
            <div>
               <label>Garniture:</label>
               <div class="etape-garniture1">
                 <select id="garniture1" name="Garniture1">
                    <option value="rien">Rien</option>
                    {% for ligne in garniture %}
                    <option value="{{ ligne[0] }}">{{ ligne[0] }}</option>  
                    {% endfor %}
                 </select>
               </div>
               <div class="etape-garniture2">
                <select id="garniture2" name="Garniture2">
                    <option value="rien">Rien</option>
                    {% for ligne in garniture %}
                    <option value="{{ ligne[0] }}">{{ ligne[0] }}</option>
                    {% endfor %}
                </select>
               </div>
                <div class="etape-garniture3">
                <select id="garniture3" name="Garniture3">
                    <option value="rien">Rien</option>
                    {% for ligne in garniture %}
                    <option value="{{ ligne[0] }}">{{ ligne[0] }}</option>
                    {% endfor %}
                </select>
               </div>
                <div class="etape-garniture4">
                <select id="garniture4" name="Garniture4">
                    <option value="rien">Rien</option>
                    {% for ligne in garniture %}
                    <option value="{{ ligne[0] }}">{{ ligne[0] }}</option>
                    {% endfor %}
                </select>
               </div>
            </div>
            <div>
                <label>Croute:</label>
                <select id="croute" name="Croute">
              {% for ligne in croute %}
             <option value="{{ ligne[0] }}">{{ ligne[0] }}</option>
              {% endfor %}
                 </select>
             </div>
            <div>
                <label>Sauce: </label>
                <select id="sauce" name="Sauce">
                 <option value="rien">Rien</option>
                    {% for ligne in sauce %}
                 <option value="{{ ligne[0] }}">{{ ligne[0] }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <button type="submit">Submit</button>
    </form>
   
</body>
</html>
